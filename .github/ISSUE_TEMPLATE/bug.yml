name: Bug
description: Something works differently from what was specified
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as a client
        2. Open today's session
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Include the error text or a screenshot.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Branch or commit, browser, viewport, theme.
