spring:
  application:
    name: kinetiq-backend
  autoconfigure:
    # sign-in is the account feature's own; without this Boot adds an unused in-memory user and logs its password
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      # 2.5 for a whole number is refused as an unreadable body, not cut to 2
      accept-float-as-int: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  messages:
    # an unsupported language falls back to messages.properties (English), not to the server's locale
    fallback-to-system-locale: false
  web:
    resources:
      # WebConfig registers the only static handler, with the SPA fallback
      add-mappings: false
  docker:
    compose:
      lifecycle-management: start_only
  session:
    # idle time; every request starts it again
    timeout: 14d
    jdbc:
      # the tables come from Flyway
      initialize-schema: never

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: true
        # without an age the cookie dies with the browser; the server's 14 idle days end a sign-in
        # ponytail: written only at sign-in, so daily use still ends after 400 days (browser cap); rewrite per answer to lift
        max-age: 400d

kinetiq:
  # where links in emails point to
  app-url: ${KINETIQ_APP_URL:http://localhost:5173}
  mail:
    # an empty key keeps the logging adapter; both are set only where real mail must go out
    api-key: ${MAIL_API_KEY:}
    from: ${MAIL_FROM:}
  plan-drafting:
    # an empty key means no drafting: every quiz submit gets an empty failed draft at once
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:openrouter/free}
    # one attempt; a drafting still running after two attempts and the pause between them is ended by the sweep
    timeout: 150s
    max-tokens: 16000
    temperature: 0.2
    reasoning-effort: low

logging:
  level:
    # Spring AI writes whole prompts to its warnings, and a prompt holds a client's notes; failures are logged by the adapter
    org.springframework.ai: "OFF"

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  # query parameter records become separate parameters in the OpenAPI document, as Spring binds them
  default-flat-param-object: true
