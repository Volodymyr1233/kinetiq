spring:
  application:
    name: kinetiq-backend
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  messages:
    # an unsupported language falls back to messages.properties (English), not to the server's locale
    fallback-to-system-locale: false
  docker:
    compose:
      lifecycle-management: start_only
  session:
    # idle time; every request starts it again
    timeout: 14d
    jdbc:
      # the tables come from Flyway
      initialize-schema: never

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: true
        # without an age the cookie dies with the browser; the server's 14 idle days end a sign-in
        # ponytail: written only at sign-in, so daily use still ends after 400 days (browser cap); rewrite per answer to lift
        max-age: 400d

kinetiq:
  # where links in emails point to
  app-url: ${KINETIQ_APP_URL:http://localhost:5173}
  llm:
    # empty means no language model: drafting uses the fixed template and nothing is called
    api-key: ${OPENROUTER_API_KEY:}
    base-url: https://openrouter.ai/api/v1
    # OpenRouter's router over its free models
    model: openrouter/free
    timeout: 30s

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  # query parameter records become separate parameters in the OpenAPI document, as Spring binds them
  default-flat-param-object: true
