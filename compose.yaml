# Local development only. The backend starts this automatically on bootRun.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: kinetiq
      POSTGRES_USER: kinetiq
      POSTGRES_PASSWORD: kinetiq
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
